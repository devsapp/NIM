edition: 3.0.0
name: asr
access: '{{ access }}'

vars: 
  region: "{{ region }}"
  functionName: "nim_asr" 
  imageUrlASR: cap-demo-public-registry.cn-hangzhou.cr.aliyuncs.com/cap-app/image-nim-frontend:asr-forntend-v1
  imageUrlParakeet: cap-demo-public-registry.cn-hangzhou.cr.aliyuncs.com/cap-app/image-nim-model:parakeet-v1
  apiKey: "{{ apiKey }}"
  gpu: "{{ gpu }}"
  role: "acs:ram::${config('AccountID')}:role/aliyundevsdefaultrole"
  

resources:
  # 初始化模型函数
  initial:
    component: fc3
    actions:
      complete-deploy:
        - run: s cli fc3 invoke --timeout 3600 -a {{ access }} --function-name init-asr --region cn-shanghai
    props:
      region: ${vars.region}
      functionName: init-asr
      description: 模型初始化函数
      handler: main.handler
      timeout: 3600
      diskSize: 10240
      code: './initial'
      runtime: python3.10
      cpu: 16
      instanceConcurrency: 1
      memorySize: 32768
      vpcConfig: auto
      logConfig: auto
      nasConfig: auto


  # FrontEnd
  asr:
    component: fc3
    props:
      region: "${vars.region}" 
      functionName: ${vars.functionName}
      description: "nim asr frontend"

      handler: index.handler
      timeout: 600
      diskSize: 512

      # 运行时
      runtime: custom-container
      customContainerConfig:
        port: 8501
        image: ${vars.imageUrlASR}
        # 暂时性解决 updatefunction 不支持 acree 的问题
        registryConfig:
          certConfig:
            insecure: false
      # 规格
      instanceConcurrency: 100
      cpu: 8
      memorySize: 32768
      vpcConfig: auto
      logConfig: auto

      environmentVariables:
        ENTRY_URL: "${resources.parakeet.info.urlInternet}:8089"
        API_KEY: "${vars.apiKey}"

      customDomain: 
        protocol: "HTTP"  
        route:  
          path: "/*"  
          qualifier: "LATEST" 
        domainName  : auto


  #backend
  parakeet:
    component: model
    props:
      region: ${vars.region}
      name: "parakeet"
      description: ASR 后端 parakeet 函数
      logConfig: auto
      modelConfig:
        sourceType: custom-container
      role: '${vars.role}'

      timeout: 600
      diskSize: 30720
      cpu: 8
      memorySize: 65536
      instanceConcurrency: 10
      gpuConfig:
        gpuMemorySize: 49152
        gpuType: '${vars.gpu}'
      provisionConfig:
        target: 1
        alwaysAllocateGPU: false

      # 运行时
      runtime: custom-container
      vpcConfig: auto
      nasConfig:
        userId: 0
        groupId: 0
        mountPoints:
          - serverAddr: ${resources.initial.output.nasConfig.mountPoints.0.serverAddr}
            mountDir: /mnt/auto

      customContainerConfig:
        port: 50051
        image: ${vars.imageUrlParakeet}
        instanceConcurrency: 10
        webServerMode: true
        # 暂时性解决 updatefunction 不支持 acree 的问题
        registryConfig:
          certConfig:
            insecure: false
      
      environmentVariables:
        NGC_API_KEY: "${vars.apiKey}" 
        NIM_CACHE_PATH: "/mnt/auto"
        NIM_HTTP_API_PORT: "9000"
        NIM_MANIFEST_PROFILE: "40d7e326-43f4-11ef-87a2-239b5c506ca7"
        NIMFC_MODEL_EGREP: "parakeet-ctc-riva-1-1b.*l40|punctuation-riva.*l40"  

      httpTrigger: auto